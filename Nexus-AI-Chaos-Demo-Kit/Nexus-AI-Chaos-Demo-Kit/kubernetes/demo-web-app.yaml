apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web-app
  namespace: default
  labels:
    app: demo-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web-app
  template:
    metadata:
      labels:
        app: demo-web-app
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: demo-web-app
          image: nexus-demo-web-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-app
  namespace: default
  labels:
    app: demo-web-app
spec:
  selector:
    app: demo-web-app
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
